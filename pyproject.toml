[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frameforge-api"
version = "0.1.0"
description = "Versioned API foundation for Frameforge Studio"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.120", "starlette>=0.40,<0.47", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3", "python-jose[cryptography]>=3.3,<4", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
